<div class="contain">

    <div class="main">

        <form id="login-form" novalidate>

            <h1>
                Login Page
            </h1>


            <div
                class="form-errors"
                id="form-errors"
                style="display: none;"
            ></div>


            <div class="input-box">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                    class="username"
                    id="username"
                >

                <i class="bx bxs-user"></i>

            </div>


            <div class="input-box">

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    class="password"
                    id="password"
                >

                <i class="bx bx-lock-alt"></i>

            </div>


            <div class="remember-forgeet">

                <label for="check">
                    <input
                        type="checkbox"
                        id="check"
                    >
                    Remember Me
                </label>

                <a
                    href="#"
                    class="forget-link"
                    onclick="send_pass(); return false;"
                >
                    Forgot Password
                </a>

            </div>


            <div class="buttonn">

                <button
                    type="submit"
                    class="btn"
                >
                    <b>Login</b>
                </button>

            </div>


            <div class="regester-link">

                <p>
                    Don't have an account?

                    <a href="signup.html">
                        Register
                    </a>
                </p>

            </div>

        </form>

    </div>
