{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>

    <!-- Style -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Fonts -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:wght@100;300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <a href="{% url 'home' %}">Main</a>
        <a href="{% url 'login' %}">Sign In</a>
        <a href="{% url 'signup' %}">Sign Up</a>
        <a href="{% url 'books' %}">Books</a>
        <a href="{% url 'cart' %}">Purchases</a>
        <a href="{% url 'user_profile' %}">User Profile</a>
        <a href="{% url 'contact' %}">About Us</a>
    </nav>

    <div class="contain">
        <div class="main">
            <form method="post" novalidate>
                {% csrf_token %}
                <h1>Sign Up</h1>
                {% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" required class="username">
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required class="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password1" placeholder="Password" required class="password">
                    <i class='bx bx-lock-alt'></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password2" placeholder="Confirm Password" required class="confirm-password">
                    <i class='bx bx-lock-alt'></i>
                </div>
                <div class="remember-forgeet">
                    <label for="check"><input type="checkbox" id="check">I agree to the terms</label>
                    <a href="#" class="terms-link">Terms & Conditions</a>
                </div>
                <div class="buttonn">
                    <button type="submit" class="btn"><b>Sign Up</b></button>
                </div>
                <div class="regester-link">
                    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer" style="background-color: transparent;">
        <a href="#" target="_blank">
            <p>2025 © Ibrahiem Hamdie, All Rights Reserved</p>
        </a>
    </footer>

    <script src="{% static 'javascript/signup.js' %}"></script>
</body>

</html>
